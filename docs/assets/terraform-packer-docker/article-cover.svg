<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Building Docker Images with Terraform and Packer</title>
<desc>Two independent paths. Terraform calls Docker build, produces a local image, and manages a container through image_id. Packer provisions and commits a temporary container, tags its image, and leaves docker run as a separate step.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101727"/><stop offset="1" stop-color="#070c17"/></linearGradient>
  <pattern id="cover-grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#a8b7d6" stroke-opacity=".045"/></pattern>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; }
.c-grid { fill:none; stroke:none; }
.c-mask { fill:#101727; }
.c-backend,.c-database,.c-frontend { fill:#171d30; stroke:#9c82ec; }
[id^="node-pk-"] .c-backend,[id^="node-pk-"] .c-database,[id^="node-pk-"] .c-frontend { fill:#0d252f;stroke:#54c8dd; }
.t-primary { fill:#f7f9ff;font-size:19px;font-weight:700; }
.t-muted { fill:#b8c3d9;font-size:13px; }
.a-default,.a-dashed { fill:none;stroke:#9c82ec;stroke-width:2; }
[data-edge-from^="pk-"] { stroke:#54c8dd; }
.a-dashed { stroke-dasharray:6 4; }
.m-default { fill:#9c82ec; }
.m-dashed { fill:#54c8dd; }
</style>
<rect width="1920" height="1080" fill="url(#bg)"/>
<rect width="1920" height="1080" fill="url(#cover-grid)"/>
<rect x="100" y="86" width="46" height="6" rx="3" fill="#ab8cff"/>
<text x="165" y="99" fill="#b4c1d8" font-size="24" font-weight="600" letter-spacing="4">A TECHNICAL WALKTHROUGH</text>
<text x="96" y="214" fill="#f5f7fc" font-size="86" font-weight="700" letter-spacing="-2">Building Docker Images</text>
<text x="100" y="310" fill="#f5f7fc" font-size="73" font-weight="700" letter-spacing="-1">with <tspan fill="#b99cff">Terraform</tspan> &amp; <tspan fill="#70d7e9">Packer</tspan></text>
<path d="M100 367H1820" stroke="#334158"/>
<text x="130" y="455" fill="#b99cff" font-size="22" font-weight="700" letter-spacing="2">01  TERRAFORM: BUILD + MANAGE</text>
